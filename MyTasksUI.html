<!-- ========================================== -->
<!-- [MyTasksUI.html] 我的任務看板與卡片區塊 -->
<!-- ========================================== -->

<div id="individualSection" class="section-container">
  <h3 class="mb-3"><i class="fas fa-tasks"></i> 我的任務 (My Tasks)</h3>
  <div id="pmAlertArea" class="mb-3"></div>

  <div class="row mb-4 text-center">
    <div class="col-md-3">
      <div class="card bg-danger text-white shadow-sm"><div class="card-body">
        <h5 class="card-title"><i class="fas fa-fire"></i> 已逾期</h5>
        <h2 class="fw-bold" id="countOverdue">0</h2>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card bg-warning text-dark shadow-sm"><div class="card-body">
        <h5 class="card-title"><i class="fas fa-exclamation-triangle"></i> 即將到期</h5>
        <h2 class="fw-bold" id="countDueSoon">0</h2>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card bg-success text-white shadow-sm"><div class="card-body">
        <h5 class="card-title"><i class="fas fa-running"></i> 進行中</h5>
        <h2 class="fw-bold" id="countOnTrack">0</h2>
      </div></div>
    </div>
    <div class="col-md-3">
      <div class="card bg-secondary text-white shadow-sm"><div class="card-body">
        <h5 class="card-title"><i class="fas fa-hourglass-start"></i> 即將到來</h5>
        <h2 class="fw-bold" id="countUpcoming">0</h2>
      </div></div>
    </div>
  </div>

  <div class="row">
    <!-- 緊急區 -->
    <div class="col-12 mb-4">
      <h5 class="text-danger border-bottom border-danger pb-2"><i class="fas fa-exclamation-circle"></i> 需緊急處理 (逾期 / < 3天)</h5>
      <div id="urgentTasksArea" class="row"></div>
    </div>
    <!-- 進行中區 -->
    <div class="col-12 mb-4">
      <h5 class="text-success border-bottom border-success pb-2"><i class="fas fa-check-circle"></i> 穩步進行中 (On Track)</h5>
      <div id="onTrackTasksArea" class="row"></div>
    </div>
    <!-- 待啟動/即將到來區 -->
    <div class="col-12 mb-4">
      <h5 class="text-secondary border-bottom border-secondary pb-2"><i class="fas fa-calendar-alt"></i> 待啟動 / 即將到來 (Upcoming)</h5>
      <div id="upcomingTasksArea" class="row"></div>
    </div>
    <!-- 已暫停專案區 -->
    <div class="col-12 mb-4">
      <h5 class="text-warning border-bottom border-warning pb-2 d-flex justify-content-between align-items-center">
        <span><i class="fas fa-pause-circle"></i> 已暫停專案 (Paused Projects)</span>
        <span class="badge bg-warning text-dark fs-6" id="countPaused">0</span>
      </h5>
      <div id="pausedTasksArea" class="row"></div>
    </div>
  </div>
</div>
