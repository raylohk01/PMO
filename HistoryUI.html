<!-- ========================================== -->
<!-- [HistoryUI.html] 專案歷史查詢與歸檔看板模組 -->
<!-- ========================================== -->

<div id="historySection" class="section-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-secondary mb-0"><i class="fas fa-archive me-2"></i> 已完成專案歷史 (Archive)</h3>
    <button class="btn btn-sm btn-outline-secondary" onclick="searchHistory()">
      <i class="fas fa-sync-alt me-1"></i> 重新整理
    </button>
  </div>

  <!-- 搜尋過濾列 -->
  <div class="card shadow-sm mb-4 border-0">
    <div class="card-body bg-white rounded">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fas fa-search"></i></span>
            <input type="text" id="hist_searchKeyword" class="form-control" placeholder="搜尋專案編號 / 客戶名稱 / 任務名稱 / PM...">
          </div>
        </div>
        <div class="col-md-3">
          <input type="date" id="hist_startDate" class="form-control" title="起始日期">
        </div>
        <div class="col-md-3">
          <input type="date" id="hist_endDate" class="form-control" title="結束日期">
        </div>
        <div class="col-md-2">
          <button class="btn btn-primary w-100 fw-bold" onclick="searchHistory()"><i class="fas fa-filter me-1"></i> 搜尋</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 歷史清單列表 (精準對齊 7 欄) -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Job Number</th>
              <th>客戶名稱</th>
              <th>子項目 / 任務</th>
              <th>負責 PM</th>
              <th>完成時間</th>
              <th>正式上線連結</th>
              <th class="text-end pe-3">操作</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="7" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> 載入歷史紀錄中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
