<!-- ========================================== -->
<!-- [HistoryUI.html] 專案歷史查詢與歸檔看板模組 (Tab 高對比修復版) -->
<!-- ========================================== -->

<style>
  /* 💡 強效修復 Tab 文字變白問題 */
  #historyTabs .nav-link {
    color: #495057 !important;
    background-color: #f8f9fa;
    border: 1px solid #dee2e6;
  }
  #historyTabs .nav-link.active {
    color: #0d6efd !important;
    background-color: #ffffff;
    border-color: #dee2e6 #dee2e6 #fff;
    border-top: 3px solid #0d6efd;
  }
</style>

<div id="historySection" class="section-container">
  
  <!-- 頁籤導覽 (Tabs) -->
  <ul class="nav nav-tabs mb-4" id="historyTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active fw-bold fs-6" id="archive-tab" data-bs-toggle="tab" data-bs-target="#archiveTabPane" type="button" role="tab">
        <i class="fas fa-archive me-2 text-secondary"></i>已完成專案歷史 (Archive)
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link fw-bold fs-6" id="recycle-tab" data-bs-toggle="tab" data-bs-target="#recycleTabPane" type="button" role="tab" onclick="if(typeof loadRecycleBinData==='function') loadRecycleBinData();">
        <i class="fas fa-trash-alt me-2 text-danger"></i>專案回收箱 (Recycle Bin)
      </button>
    </li>
  </ul>

  <div class="tab-content" id="historyTabsContent">
    
    <!-- Tab 1: 已完成專案歷史 -->
    <div class="tab-pane fade show active" id="archiveTabPane" role="tabpanel">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="text-secondary mb-0"><i class="fas fa-list me-2"></i> 已完成專案列表</h4>
        <button class="btn btn-sm btn-outline-secondary" onclick="searchHistory()">
          <i class="fas fa-sync-alt me-1"></i> 重新整理
        </button>
      </div>

      <!-- 搜尋過濾列 -->
      <div class="card shadow-sm mb-4 border-0">
        <div class="card-body bg-white rounded">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="fas fa-search"></i></span>
                <input type="text" id="hist_searchKeyword" class="form-control" placeholder="搜尋專案編號 / 客戶名稱 / 任務名稱 / PM...">
              </div>
            </div>
            <div class="col-md-3">
              <input type="date" id="hist_startDate" class="form-control" title="起始日期">
            </div>
            <div class="col-md-3">
              <input type="date" id="hist_endDate" class="form-control" title="結束日期">
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100 fw-bold" onclick="searchHistory()"><i class="fas fa-filter me-1"></i> 搜尋</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 歷史清單列表 (對齊 9 欄) -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Job Number</th>
                  <th>客戶名稱</th>
                  <th>子項目 / 任務</th>
                  <th>負責 PM</th>
                  <th>專案總耗時</th>
                  <th>總死線</th>
                  <th>完成時間</th>
                  <th>客戶修改次數</th> <!-- 💡 新增欄位 -->
                  <th>正式上線連結</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="9" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> 載入歷史紀錄中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: 專案回收箱區塊 -->
    <div class="tab-pane fade" id="recycleTabPane" role="tabpanel">
      <div id="recycleBinBlock">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="text-danger mb-0"><i class="fas fa-trash-alt me-2"></i> 已刪除專案列表</h4>
        </div>
        <div class="card shadow-sm border-danger border-opacity-25">
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>專案編號</th>
                    <th>客戶名稱</th>
                    <th>負責 PM</th>
                    <th class="text-end pe-3">操作</th>
                  </tr>
                </thead>
                <tbody id="recycleBinTableBody">
                  <tr><td colspan="4" class="text-center text-muted py-3">回收箱目前沒有專案</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>


<!-- 🚀 還原專案專用 Modal -->
<div class="modal fade" id="restoreProjectModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" style="z-index: 1060;">
  <div class="modal-dialog">
    <div class="modal-content shadow">
      <div class="modal-header bg-success text-white py-2">
        <h5 class="modal-title fs-6"><i class="fas fa-undo me-1"></i> 確認還原專案</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-light">
        <p class="mb-0 text-dark">確定要將專案 <strong id="rp_jobNumber" class="text-primary fs-5"></strong> 從回收箱還原嗎？</p>
        <p class="small text-muted mt-2 mb-0">還原後，專案將回到「進行中」狀態並重新出現在任務看板。</p>
      </div>
      <div class="modal-footer bg-white py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success btn-sm fw-bold" id="rp_btnConfirm" onclick="confirmRestoreProject()"><i class="fas fa-check-circle me-1"></i> 確認還原</button>
      </div>
    </div>
  </div>
</div>
