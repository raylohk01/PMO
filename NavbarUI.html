<!-- ========================================== -->
<!-- [NavbarUI.html] 頂部導覽列與選單模組 -->
<!-- ========================================== -->

<div id="simulateBanner">
  <i class="fas fa-user-secret"></i> ⚠️ 正在模擬身分：<span id="simTargetName"></span> (<span id="simTargetRole"></span>)
  <button class="btn btn-sm btn-light ms-3 fw-bold text-danger" onclick="exitSimulation()">退出模擬</button>
</div>

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold me-4" href="#"><i class="fas fa-project-diagram me-1"></i> HK01 PMO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- 💡 加上 desktop-nav-links，手機端會自動隱藏 -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 desktop-nav-links">
        <li class="nav-item" id="nav_tasks">
          <a class="nav-link fw-bold" href="#" onclick="switchSection('individualSection')">我的任務</a>
        </li>
        <li class="nav-item" id="nav_clientReview">
          <a class="nav-link fw-bold" href="#" onclick="switchSection('clientReviewSection')">客戶追蹤</a>
        </li>
        <li class="nav-item" id="nav_deptKanban">
          <a class="nav-link fw-bold" href="#" onclick="switchSection('deptHeadSection')">部門看板</a>
        </li>
        <li class="nav-item" id="nav_management">
          <a class="nav-link text-info fw-bold" href="#" onclick="switchSection('analyticsSection')">全局管理</a>
        </li>
        <li class="nav-item" id="nav_history">
          <a class="nav-link text-info fw-bold" href="#" onclick="switchSection('historySection')"><i class="fas fa-archive me-1"></i>專案歷史</a>
        </li>
        <li class="nav-item" id="nav_admin">
          <a class="nav-link text-warning fw-bold" href="#" onclick="switchSection('adminSection')"><i class="fas fa-cog me-1"></i>系統設定</a>
        </li>
      </ul>
      
      <div class="d-flex align-items-center">
        <!-- 🔔 導覽列鈴鐺按鈕 (貼在這裡！) -->
        <button class="btn btn-outline-light position-relative me-3 shadow-sm border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#notificationOffcanvas" onclick="fetchNotifications()" style="background: transparent;">
          <i class="fas fa-bell fs-5"></i>
          <!-- 動態紅點 -->
          <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow" style="display: none; font-size: 0.65em;">
            0
          </span>
        </button>
        
        <button class="btn btn-sm btn-light text-primary fw-bold me-3 rounded-pill shadow-sm px-3" onclick="openNewProjectModal()">
          <i class="fas fa-plus"></i> 新增專案
        </button>
        <span class="navbar-text text-white" id="userInfo">
          <i class="fas fa-spinner fa-spin"></i> 載入身分中...
        </span>
      </div>

    </div>
  </div>
</nav>

<!-- 💡 Mobile UX: 專屬底部導覽列 (Bottom Navigation Bar) -->
<div class="bottom-nav d-md-none">
  <a href="#" class="bottom-nav-item active" id="bnav_tasks" onclick="switchSection('individualSection'); updateBottomNav('bnav_tasks');">
    <i class="fas fa-tasks"></i><span>任務</span>
  </a>
  <a href="#" class="bottom-nav-item" id="bnav_clientReview" onclick="switchSection('clientReviewSection'); updateBottomNav('bnav_clientReview');">
    <i class="fas fa-clock"></i><span>追蹤</span>
  </a>
  <a href="#" class="bottom-nav-item" id="bnav_deptKanban" onclick="switchSection('deptHeadSection'); updateBottomNav('bnav_deptKanban');">
    <i class="fas fa-columns"></i><span>看板</span>
  </a>
  <a href="#" class="bottom-nav-item" id="bnav_management" onclick="switchSection('analyticsSection'); updateBottomNav('bnav_management');">
    <i class="fas fa-tv"></i><span>管理</span>
  </a>
  <a href="#" class="bottom-nav-item" id="bnav_admin" onclick="switchSection('adminSection'); updateBottomNav('bnav_admin');">
    <i class="fas fa-cog"></i><span>設定</span>
  </a>
</div>

<script>
  // 連動底部導航按鈕的亮燈狀態
  function updateBottomNav(activeId) {
    document.querySelectorAll('.bottom-nav-item').forEach(function(el) { el.classList.remove('active'); });
    var target = document.getElementById(activeId);
    if (target) target.classList.add('active');
  }
</script>
