<!-- ========================================== -->
<!-- [DeptKanbanUI.html] 營運導向部門指揮中心 (日曆導航 + 終極防呆版) -->
<!-- ========================================== -->

<div id="deptHeadSection" class="section-container" style="display: none;">
  
  <!-- 💡 1. 頂部工具列：部門視角與時間過濾 -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body p-3 bg-white rounded">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        
        <div class="d-flex align-items-center gap-3">
          <div class="d-flex align-items-center gap-2">
            <h4 class="fw-bold text-primary mb-0"><i class="fas fa-columns me-2"></i>部門營運指揮中心</h4>
            <span id="op_deptBadge" class="badge bg-primary fs-6">Editorial</span>
          </div>

          <!-- 切換部門下拉選單 -->
          <div class="d-flex align-items-center gap-2" id="op_deptSelectorBox" style="min-width: 220px;">
            <label class="small text-muted fw-bold text-nowrap">切換部門：</label>
            <select class="form-select form-select-sm border-primary fw-bold text-dark" style="width: 150px; cursor: pointer;" id="op_deptSelect" onchange="switchDeptKanbanView(this.value)">
              <option value="Editorial" selected>Editorial</option>
              <option value="PM">PM</option>
              <option value="Creative">Creative</option>
              <option value="Design">Design</option>
              <option value="AdOps">AdOps</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
        </div>

        <!-- 時間過濾按鈕群 -->
        <div class="d-flex align-items-center flex-wrap gap-2">
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-primary" id="btn_op_TODAY" onclick="changeOpTimeRange('TODAY')">今天</button>
            <button type="button" class="btn btn-outline-primary" id="btn_op_LAST_5_DAYS" onclick="changeOpTimeRange('LAST_5_DAYS')">過去5天</button>
            <button type="button" class="btn btn-outline-primary active" id="btn_op_NEXT_14_DAYS" onclick="changeOpTimeRange('NEXT_14_DAYS')">未來14天 (預設)</button>
            <button type="button" class="btn btn-outline-primary" id="btn_op_LAST_30_DAYS" onclick="changeOpTimeRange('LAST_30_DAYS')">過去30天</button>
          </div>

          <div class="d-flex align-items-center gap-1" style="font-size:0.85em;">
            <input type="date" class="form-control form-control-sm" id="op_startDate">
            <span>至</span>
            <input type="date" class="form-control form-control-sm" id="op_endDate">
            <button class="btn btn-sm btn-primary py-1 px-2" onclick="applyOpCustomDateRange()"><i class="fas fa-search"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 💡 2. 頂部 5 欄 KPI 統計卡片 -->
  <div class="row g-2 mb-3 row-cols-2 row-cols-md-5">
    <div class="col">
      <div class="card shadow-sm border-0 border-start border-4 border-danger cursor-pointer h-100" id="card_kpi_OVERDUE" onclick="filterOpTasksByKpi('OVERDUE')" style="transition: 0.2s;">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">
          <div>
            <small class="text-muted fw-bold">🚨 已到期</small>
            <h4 class="fw-bold text-danger mb-0" id="op_kpi_overdue">0</h4>
          </div>
          <i class="fas fa-exclamation-circle fa-2x text-danger opacity-25"></i>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card shadow-sm border-0 border-start border-4 border-info cursor-pointer h-100" id="card_kpi_UNASSIGNED" onclick="filterOpTasksByKpi('UNASSIGNED')" style="transition: 0.2s;">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">
          <div>
            <small class="text-muted fw-bold">📥 待分配</small>
            <h4 class="fw-bold text-info mb-0" id="op_kpi_unassigned">0</h4>
          </div>
          <i class="fas fa-user-plus fa-2x text-info opacity-25"></i>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card shadow-sm border-0 border-start border-4 border-warning cursor-pointer h-100" id="card_kpi_DUE_SOON" onclick="filterOpTasksByKpi('DUE_SOON')" style="transition: 0.2s;">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">
          <div>
            <small class="text-muted fw-bold">⚠️ 即將到期</small>
            <h4 class="fw-bold text-warning mb-0" id="op_kpi_dueSoon">0</h4>
          </div>
          <i class="fas fa-clock fa-2x text-warning opacity-25"></i>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card shadow-sm border-0 border-start border-4 border-primary cursor-pointer h-100" id="card_kpi_ACTIVE" onclick="filterOpTasksByKpi('ACTIVE')" style="transition: 0.2s;">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">
          <div>
            <small class="text-muted fw-bold">🏃 部門進行中</small>
            <h4 class="fw-bold text-primary mb-0" id="op_kpi_active">0</h4>
          </div>
          <i class="fas fa-running fa-2x text-primary opacity-25"></i>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card shadow-sm border-0 border-start border-4 border-secondary cursor-pointer h-100" id="card_kpi_PIPELINE" onclick="filterOpTasksByKpi('PIPELINE')" style="transition: 0.2s;">
        <div class="card-body p-2 d-flex justify-content-between align-items-center">
          <div>
            <small class="text-muted fw-bold">🔮 未來管線</small>
            <h4 class="fw-bold text-secondary mb-0" id="op_kpi_pipeline">0</h4>
          </div>
          <i class="fas fa-forward fa-2x text-secondary opacity-25"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- 💡 3. 同仁產能與負載面板 -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body p-2 bg-white rounded">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="fw-bold text-dark small"><i class="fas fa-users-cog text-primary me-1"></i> 組員產能與工作量分析 (點擊可篩選個人任務)：</span>
      </div>
      <div id="op_memberCapacityArea" class="d-flex flex-wrap gap-2">
        <span class="text-muted small"><i class="fas fa-spinner fa-spin"></i> 計算產能中...</span>
      </div>
    </div>
  </div>

  <!-- 💡 4. 動態產能日曆 (支援前後導航切換) -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body p-2 bg-white rounded">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="fw-bold text-dark small">
          <i class="fas fa-calendar-alt text-info me-1"></i> 部門營運日曆 (🖊️ 可快捷調整死線至空檔日)
        </span>
        
        <div class="d-flex align-items-center gap-2">
          <!-- 導航切換 -->
          <div class="btn-group btn-group-sm me-2" role="group">
            <button type="button" class="btn btn-outline-secondary" onclick="navigateCalendar(-1)" title="上一期"><i class="fas fa-chevron-left"></i></button>
            <button type="button" class="btn btn-outline-secondary fw-bold" onclick="resetCalendarDate()">本期</button>
            <button type="button" class="btn btn-outline-secondary" onclick="navigateCalendar(1)" title="下一期"><i class="fas fa-chevron-right"></i></button>
          </div>
          <!-- 模式切換 -->
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-secondary" id="btn_view_DAY" onclick="switchCalendarViewMode('DAY')">日</button>
            <button type="button" class="btn btn-outline-secondary active" id="btn_view_WEEK" onclick="switchCalendarViewMode('WEEK')">週</button>
            <button type="button" class="btn btn-outline-secondary" id="btn_view_MONTH" onclick="switchCalendarViewMode('MONTH')">月</button>
          </div>
        </div>
      </div>

      <div id="op_calendarGridContainer">
        <div id="op_calendarGrid" class="row g-1 text-center" style="font-size:0.8em;">
          <div class="col text-muted py-3"><i class="fas fa-spinner fa-spin"></i> 載入產能日曆中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 💡 5. 五欄式營運操作指揮區 -->
  <div class="row g-2">
    <div class="col" style="min-width: 200px;">
      <div class="card shadow-sm border-0 border-top border-4 border-danger h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small"><i class="fas fa-exclamation-circle text-danger me-1"></i> 已到期</span>
          <span class="badge bg-danger" id="op_countOverdue">0 件</span>
        </div>
        <div class="card-body bg-light p-2" style="max-height: 550px; overflow-y: auto;" id="op_overdueContainer">
          <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <div class="col" style="min-width: 200px;">
      <div class="card shadow-sm border-0 border-top border-4 border-info h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small"><i class="fas fa-user-plus text-info me-1"></i> 待分配</span>
          <span class="badge bg-info text-dark" id="op_countUnassigned">0 件</span>
        </div>
        <div class="card-body bg-light p-2" style="max-height: 550px; overflow-y: auto;" id="op_unassignedContainer">
          <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <div class="col" style="min-width: 200px;">
      <div class="card shadow-sm border-0 border-top border-4 border-warning h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small"><i class="fas fa-clock text-warning me-1"></i> 即將到期</span>
          <span class="badge bg-warning text-dark" id="op_countDueSoon">0 件</span>
        </div>
        <div class="card-body bg-light p-2" style="max-height: 550px; overflow-y: auto;" id="op_dueSoonContainer">
          <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <div class="col" style="min-width: 200px;">
      <div class="card shadow-sm border-0 border-top border-4 border-primary h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small"><i class="fas fa-running text-primary me-1"></i> 部門進行中</span>
          <span class="badge bg-primary" id="op_countActive">0 件</span>
        </div>
        <div class="card-body bg-light p-2" style="max-height: 550px; overflow-y: auto;" id="op_activeContainer">
          <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>

    <div class="col" style="min-width: 200px;">
      <div class="card shadow-sm border-0 border-top border-4 border-secondary h-100">
        <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
          <span class="fw-bold text-dark small"><i class="fas fa-forward text-secondary me-1"></i> 未來預備管線</span>
          <span class="badge bg-secondary" id="op_countPipeline">0 件</span>
        </div>
        <div class="card-body bg-light p-2" style="max-height: 550px; overflow-y: auto;" id="op_pipelineContainer">
          <div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var currentOpDept = '';
  var currentOpTimeRange = 'NEXT_14_DAYS';
  var selectedOpMember = null;
  var selectedOpKpiFilter = null;
  var rawOpData = null;
  
  var currentCalendarMode = 'WEEK'; 
  var currentCalendarBaseDate = new Date(); 

  function loadDeptHeadView(dept, simEmail) {
    var section = document.getElementById('deptHeadSection');
    if (section) section.style.display = 'block';

    var isEvent = (dept && typeof dept === 'object' && dept.type);
    var safeDept = (!isEvent && typeof dept === 'string' && dept.trim() !== '' && !dept.includes('[object')) ? dept.trim() : null;

    if (safeDept) {
      currentOpDept = safeDept;
    } else if (typeof currentUser !== 'undefined' && currentUser) {
      if (currentUser.role === 'Management' || currentUser.department === 'Management') {
        currentOpDept = 'PM';
      } else if (currentUser.department && typeof currentUser.department === 'string' && currentUser.department.trim() !== '') {
        currentOpDept = currentUser.department.trim();
      } else {
        currentOpDept = 'Editorial'; 
      }
    } else {
      currentOpDept = 'Editorial';
    }

    currentOpDept = String(currentOpDept).trim();

    var badgeEl = document.getElementById('op_deptBadge');
    if (badgeEl) badgeEl.innerText = currentOpDept;

    var selectEl = document.getElementById('op_deptSelect');
    if (selectEl) {
      var found = false;
      for (var i = 0; i < selectEl.options.length; i++) {
        if (selectEl.options[i].value.toLowerCase() === currentOpDept.toLowerCase()) {
          selectEl.selectedIndex = i;
          found = true;
          break;
        }
      }
      if (!found) {
        selectEl.selectedIndex = 0;
        currentOpDept = 'Editorial';
        if (badgeEl) badgeEl.innerText = currentOpDept;
      }
    }

    fetchDeptOperationData();
  }

  function switchDeptKanbanView(dept) {
    if (!dept) return;
    currentOpDept = String(dept).trim();
    var badgeEl = document.getElementById('op_deptBadge');
    if (badgeEl) badgeEl.innerText = currentOpDept;
    fetchDeptOperationData();
  }

  function switchCalendarViewMode(mode) {
    currentCalendarMode = String(mode).trim();
    currentCalendarBaseDate = new Date(); 
    ['DAY', 'WEEK', 'MONTH'].forEach(function(m) {
      var btn = document.getElementById('btn_view_' + m);
      if (btn) btn.classList.toggle('active', m === currentCalendarMode);
    });
    if (rawOpData) renderCapacityCalendar(rawOpData.calendarMap || {}, rawOpData.calendarTasks || []);
  }

  function navigateCalendar(direction) {
    if (currentCalendarMode === 'DAY') {
      currentCalendarBaseDate.setDate(currentCalendarBaseDate.getDate() + direction);
    } else if (currentCalendarMode === 'WEEK') {
      currentCalendarBaseDate.setDate(currentCalendarBaseDate.getDate() + (direction * 7));
    } else if (currentCalendarMode === 'MONTH') {
      currentCalendarBaseDate.setMonth(currentCalendarBaseDate.getMonth() + direction);
    }
    if (rawOpData) renderCapacityCalendar(rawOpData.calendarMap || {}, rawOpData.calendarTasks || []);
  }

  function resetCalendarDate() {
    currentCalendarBaseDate = new Date();
    if (rawOpData) renderCapacityCalendar(rawOpData.calendarMap || {}, rawOpData.calendarTasks || []);
  }

  function changeOpTimeRange(range) {
    currentOpTimeRange = String(range).trim();
    ['TODAY', 'LAST_5_DAYS', 'NEXT_14_DAYS', 'LAST_30_DAYS'].forEach(function(r) {
      var btn = document.getElementById('btn_op_' + r);
      if (btn) btn.classList.toggle('active', r === currentOpTimeRange);
    });
    fetchDeptOperationData();
  }

  function applyOpCustomDateRange() {
    var start = document.getElementById('op_startDate').value;
    var end = document.getElementById('op_endDate').value;
    if (!start || !end) return alert('請選擇完整日期區間！');
    fetchDeptOperationData('CUSTOM', start, end);
  }

  function filterOpTasksByKpi(type) {
    selectedOpKpiFilter = selectedOpKpiFilter === type ? null : type; 
    ['OVERDUE', 'DUE_SOON', 'UNASSIGNED', 'ACTIVE', 'PIPELINE'].forEach(function(kpi) {
      var el = document.getElementById('card_kpi_' + kpi);
      if (el) {
        if (selectedOpKpiFilter) {
          el.style.opacity = (selectedOpKpiFilter === kpi) ? '1' : '0.4';
          el.style.transform = (selectedOpKpiFilter === kpi) ? 'scale(1.02)' : 'scale(1)';
        } else {
          el.style.opacity = '1';
          el.style.transform = 'scale(1)';
        }
      }
    });
    renderOpColumns();
  }

  function filterOpTasksByMember(memberName) {
    selectedOpMember = selectedOpMember === memberName ? null : memberName;
    renderMemberCapacityChips(rawOpData ? rawOpData.capacityList : []);
    renderOpColumns();
  }

  function fetchDeptOperationData(customType, start, end) {
    var areaCap = document.getElementById('op_memberCapacityArea');
    var areaCal = document.getElementById('op_calendarGrid');
    var containerOverdue = document.getElementById('op_overdueContainer');
    var containerUnassigned = document.getElementById('op_unassignedContainer');
    var containerDueSoon = document.getElementById('op_dueSoonContainer');
    var containerActive = document.getElementById('op_activeContainer');
    var containerPipeline = document.getElementById('op_pipelineContainer');

    if (areaCap) areaCap.innerHTML = '<span class="text-muted small"><i class="fas fa-spinner fa-spin"></i> 計算產能中...</span>';
    if (areaCal) areaCal.innerHTML = '<div class="col text-muted py-3"><i class="fas fa-spinner fa-spin"></i> 載入產能日曆中...</div>';
    
    var spinnerHtml = '<div class="text-center text-muted py-5"><i class="fas fa-spinner fa-spin"></i><br>載入中...</div>';
    if (containerOverdue) containerOverdue.innerHTML = spinnerHtml;
    if (containerUnassigned) containerUnassigned.innerHTML = spinnerHtml;
    if (containerDueSoon) containerDueSoon.innerHTML = spinnerHtml;
    if (containerActive) containerActive.innerHTML = spinnerHtml;
    if (containerPipeline) containerPipeline.innerHTML = spinnerHtml;

    var isEv1 = (customType && typeof customType === 'object' && customType.type);
    var safeType = (!isEv1 && typeof customType === 'string' && !customType.includes('[object')) ? customType : null;
    var isEv2 = (start && typeof start === 'object' && start.type);
    var safeStart = (!isEv2 && typeof start === 'string' && !start.includes('[object')) ? start : '';
    var isEv3 = (end && typeof end === 'object' && end.type);
    var safeEnd = (!isEv3 && typeof end === 'string' && !end.includes('[object')) ? end : '';

    var pRange = safeType || currentOpTimeRange || 'NEXT_14_DAYS';
    var pStart = safeStart;
    var pEnd = safeEnd;
    var targetDept = String(currentOpDept || 'Editorial').trim();

    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.success) {
          if (typeof showAlert === 'function') showAlert('載入失敗：' + (res ? res.message : '未知'), 'danger');
          return;
        }
        rawOpData = res.data;
        renderMemberCapacityChips(res.data.capacityList || []);
        renderCapacityCalendar(res.data.calendarMap || {}, res.data.calendarTasks || []);
        renderOpColumns();
      })
      .api_getDeptOperationData(targetDept, pRange, pStart, pEnd);
  }

  function renderMemberCapacityChips(list) {
    var area = document.getElementById('op_memberCapacityArea');
    if (!area) return;

    var isAllSel = (selectedOpMember === null);
    var allBtnClass = isAllSel ? 'btn-primary' : 'btn-outline-secondary';

    var html = '<button class="btn btn-xs ' + allBtnClass + ' py-1 px-2 me-2 fw-bold" onclick="filterOpTasksByMember(null)">' +
      '<i class="fas fa-users me-1"></i>全部同事' +
    '</button>';

    if (list && list.length > 0) {
      list.forEach(function(m) {
        var isSel = selectedOpMember === m.name;
        var btnClass = isSel ? 'btn-dark fw-bold' : 'btn-outline-primary';

        html += '<button class="btn btn-xs ' + btnClass + ' py-1 px-2 d-flex align-items-center gap-1" onclick="filterOpTasksByMember(\'' + m.name + '\')">' +
          '<strong>' + m.name + '</strong>' +
          '<span class="badge bg-primary text-white">' + m.inProgress + ' 進行中</span>' +
          '<span class="badge bg-success text-white">' + m.completed + ' 完成</span>' +
          (m.revisions > 0 ? '<span class="badge bg-danger text-white">' + m.revisions + ' 修改</span>' : '') +
        '</button>';
      });
    }
    area.innerHTML = html;
  }

  function renderCapacityCalendar(calMap, tasksList) {
    var grid = document.getElementById('op_calendarGrid');
    if (!grid) return;

    var realToday = new Date();
    var baseDate = new Date(currentCalendarBaseDate);
    var year = baseDate.getFullYear();
    var month = baseDate.getMonth();
    var date = baseDate.getDate();

    function formatLocalYMD(dObj) {
      var y = dObj.getFullYear();
      var m = String(dObj.getMonth() + 1).padStart(2, '0');
      var d = String(dObj.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    var realTodayStr = formatLocalYMD(realToday);
    var daysToRender = [];

    if (currentCalendarMode === 'DAY') {
      daysToRender.push(new Date(baseDate));
    } else if (currentCalendarMode === 'WEEK') {
      var dayOfWeek = baseDate.getDay() === 0 ? 7 : baseDate.getDay();
      var startOfWeek = new Date(baseDate);
      startOfWeek.setDate(date - (dayOfWeek - 1));
      for (var i = 0; i < 7; i++) {
        var nextDay = new Date(startOfWeek);
        nextDay.setDate(startOfWeek.getDate() + i);
        daysToRender.push(nextDay);
      }
    } else if (currentCalendarMode === 'MONTH') {
      var firstDayOfMonth = new Date(year, month, 1);
      var startDay = firstDayOfMonth.getDay() === 0 ? 7 : firstDayOfMonth.getDay();
      var gridStart = new Date(firstDayOfMonth);
      gridStart.setDate(firstDayOfMonth.getDate() - (startDay - 1));

      for (var mIdx = 0; mIdx < 35; mIdx++) {
        var cellDay = new Date(gridStart);
        cellDay.setDate(gridStart.getDate() + mIdx);
        daysToRender.push(cellDay);
      }
    }

    var html = '';
    if (currentCalendarMode !== 'DAY') {
      html += '<div class="row g-1 mb-1 text-center fw-bold text-muted" style="font-size:0.85em; width:100%; margin:0;">' +
        '<div class="col">週一</div><div class="col">週二</div><div class="col">週三</div>' +
        '<div class="col">週四</div><div class="col">週五</div><div class="col">週六</div><div class="col">週日</div>' +
      '</div><div class="row g-1 text-center" style="font-size:0.85em; width:100%; margin:0;">';
    } else {
      html += '<div class="row g-1 text-center" style="font-size:0.85em; width:100%; margin:0;">';
    }

    daysToRender.forEach(function(dObj) {
      var dateStr = formatLocalYMD(dObj);
      var displayDate = (dObj.getMonth() + 1) + '/' + dObj.getDate();
      var dayName = ['日','一','二','三','四','五','六'][dObj.getDay()];
      var isToday = dateStr === realTodayStr;

      var dayTasks = (tasksList || []).filter(function(t){ return t.deadline === dateStr; });
      var taskCount = dayTasks.length;

      var bgClass = isToday ? 'bg-warning bg-opacity-20 border-warning' : 'bg-white border-light';
      var badgeClass = 'bg-success';

      if (taskCount >= 3) {
        bgClass = 'bg-danger bg-opacity-10 border-danger';
        badgeClass = 'bg-danger';
      } else if (taskCount > 0) {
        if (!isToday) bgClass = 'bg-warning bg-opacity-10 border-warning';
        badgeClass = 'bg-warning text-dark';
      }

      var tasksHtml = '';
      dayTasks.forEach(function(t) {
        var safeJobNum = String(t.jobNumber).replace(/'/g, "\\'");
        var label = t.assignee ? t.assignee : '⚠️未分配';
        
        tasksHtml += '<div class="bg-white border rounded p-2 mb-1 text-start text-truncate shadow-xs" style="font-size:0.8em; cursor:pointer;" onclick="window.openWorkflow(\'' + safeJobNum + '\')" title="' + t.client + ' - ' + t.taskName + '">' +
          '<strong>' + t.jobNumber + '</strong>: ' + label +
          ' <a href="#" onclick="event.stopPropagation(); promptQuickShiftDeadline(\'' + t.deliverableId + '\', ' + t.stepNumber + ')" class="text-secondary ms-1" title="快捷改期"><i class="fas fa-pen"></i></a>' +
        '</div>';
      });

      html += '<div class="col" style="min-width: 0;">' +
        '<div class="card h-100 border ' + bgClass + ' shadow-xs" style="min-height: 180px;">' +
          '<div class="card-header p-2 bg-transparent border-0 d-flex justify-content-between text-muted fw-bold" style="font-size:0.8em;">' +
            '<span class="' + (isToday ? 'badge bg-warning text-dark fs-6' : '') + '">' + displayDate + (currentCalendarMode === 'DAY' ? ' (' + dayName + ')' : '') + '</span>' +
            '<span class="badge ' + badgeClass + '" style="font-size:0.75em;">' + taskCount + '</span>' +
          '</div>' +
          '<div class="card-body p-1">' +
            (tasksHtml || '<small class="text-muted opacity-25" style="font-size:0.75em;">-</small>') +
          '</div>' +
        '</div>' +
      '</div>';
    });

    html += '</div>';
    grid.innerHTML = html;
  }

  function renderOpColumns() {
    if (!rawOpData) return;

    var containerOverdue = document.getElementById('op_overdueContainer');
    var containerUnassigned = document.getElementById('op_unassignedContainer');
    var containerDueSoon = document.getElementById('op_dueSoonContainer');
    var containerActive = document.getElementById('op_activeContainer');
    var containerPipeline = document.getElementById('op_pipelineContainer');

    var baseRisk = rawOpData.riskTasks || [];
    var baseActive = rawOpData.activeTasks || [];
    var basePipeline = rawOpData.pipelineTasks || [];

    var todayStr = new Date().toISOString().split('T')[0];
    var todayDate = new Date(todayStr);

    function populateDaysLeft(tasks) {
      tasks.forEach(function(t) {
        if (t.deadline) t.daysLeft = Math.ceil((new Date(t.deadline) - todayDate) / 86400000);
        else t.daysLeft = 0;
      });
    }
    populateDaysLeft(baseRisk);
    populateDaysLeft(baseActive);
    populateDaysLeft(basePipeline);

    if (selectedOpMember) {
      baseRisk = baseRisk.filter(function(t){ return t.assignee === selectedOpMember; });
      baseActive = baseActive.filter(function(t){ return t.assignee === selectedOpMember; });
      basePipeline = []; 
    }

    var countOverdue = 0, countUnassigned = 0, countDueSoon = 0, countActive = 0, countPipeline = 0;
    var tempProcessedKeys = new Set();
    var tempActiveJobNumbers = new Set();

    [].concat(baseRisk, baseActive).forEach(function(t) {
      var taskKey = (t.deliverableId || t.jobNumber) + '_' + (t.stepNumber || '1');
      if (tempProcessedKeys.has(taskKey)) return;
      if (t.jobNumber) tempActiveJobNumbers.add(String(t.jobNumber).trim().toLowerCase());

      if (t.isOverdue || t.deadline < todayStr) { countOverdue++; tempProcessedKeys.add(taskKey); }
      else if (!t.assignee) { countUnassigned++; tempProcessedKeys.add(taskKey); }
      else if (t.daysLeft <= 2) { countDueSoon++; tempProcessedKeys.add(taskKey); }
      else { countActive++; tempProcessedKeys.add(taskKey); }
    });

    basePipeline.forEach(function(p) {
      if (!tempActiveJobNumbers.has(String(p.jobNumber || '').trim().toLowerCase())) countPipeline++;
    });

    if (document.getElementById('op_kpi_overdue')) document.getElementById('op_kpi_overdue').innerText = countOverdue;
    if (document.getElementById('op_kpi_unassigned')) document.getElementById('op_kpi_unassigned').innerText = countUnassigned;
    if (document.getElementById('op_kpi_dueSoon')) document.getElementById('op_kpi_dueSoon').innerText = countDueSoon;
    if (document.getElementById('op_kpi_active')) document.getElementById('op_kpi_active').innerText = countActive;
    if (document.getElementById('op_kpi_pipeline')) document.getElementById('op_kpi_pipeline').innerText = countPipeline;

    if (selectedOpKpiFilter) {
       if (selectedOpKpiFilter === 'OVERDUE') {
          baseActive = []; basePipeline = [];
          baseRisk = baseRisk.filter(function(t) { return t.isOverdue || t.deadline < todayStr; });
       } else if (selectedOpKpiFilter === 'UNASSIGNED') {
          baseActive = []; basePipeline = [];
          baseRisk = baseRisk.filter(function(t) { return !t.assignee; });
       } else if (selectedOpKpiFilter === 'DUE_SOON') {
          baseRisk = []; basePipeline = [];
          baseActive = baseActive.filter(function(t) { return t.daysLeft <= 2; });
       } else if (selectedOpKpiFilter === 'ACTIVE') {
          baseRisk = []; basePipeline = [];
          baseActive = baseActive.filter(function(t) { return t.daysLeft > 2; });
       } else if (selectedOpKpiFilter === 'PIPELINE') {
          baseRisk = []; baseActive = [];
       }
    }

    var overdueList = [], unassignedList = [], dueSoonList = [], activeList = [], pipelineList = [];
    var processedKeys = new Set();
    var activeJobNumbers = new Set();

    [].concat(baseRisk, baseActive).forEach(function(t) {
      var taskKey = (t.deliverableId || t.jobNumber) + '_' + (t.stepNumber || '1');
      if (processedKeys.has(taskKey)) return;

      if (t.jobNumber) activeJobNumbers.add(String(t.jobNumber).trim().toLowerCase());

      if (t.isOverdue || t.deadline < todayStr) { overdueList.push(t); processedKeys.add(taskKey); }
      else if (!t.assignee) { unassignedList.push(t); processedKeys.add(taskKey); }
      else if (t.daysLeft <= 2) { dueSoonList.push(t); processedKeys.add(taskKey); }
      else { activeList.push(t); processedKeys.add(taskKey); }
    });

    if (!selectedOpMember && (!selectedOpKpiFilter || selectedOpKpiFilter === 'PIPELINE')) {
      basePipeline.forEach(function(p) {
        if (!activeJobNumbers.has(String(p.jobNumber || '').trim().toLowerCase())) {
          pipelineList.push(p);
        }
      });
    }

    if (document.getElementById('op_countOverdue')) document.getElementById('op_countOverdue').innerText = overdueList.length + ' 件';
    if (document.getElementById('op_countUnassigned')) document.getElementById('op_countUnassigned').innerText = unassignedList.length + ' 件';
    if (document.getElementById('op_countDueSoon')) document.getElementById('op_countDueSoon').innerText = dueSoonList.length + ' 件';
    if (document.getElementById('op_countActive')) document.getElementById('op_countActive').innerText = activeList.length + ' 件';
    if (document.getElementById('op_countPipeline')) document.getElementById('op_countPipeline').innerText = pipelineList.length + ' 件';

    function buildTaskCardHtml(t, borderClass, showAssignBox) {
      var safeJobNum = String(t.jobNumber).replace(/'/g, "\\'");
      var optHtml = '<option value="">選擇指派同仁...</option>';
      (rawOpData.capacityList || []).forEach(function(m) {
        optHtml += '<option value="' + m.name + '">' + m.name + ' (' + m.inProgress + '件)</option>';
      });

      var assignSection = (showAssignBox && !t.assignee) ? 
        '<div class="border-top pt-2" onclick="event.stopPropagation();">' +
          '<div class="input-group input-group-sm">' +
            '<select class="form-select form-select-sm" id="assign_select_' + t.deliverableId + '_' + t.stepNumber + '">' + optHtml + '</select>' +
            '<button class="btn btn-warning fw-bold" onclick="quickDispatchMember(\'' + t.deliverableId + '\', ' + t.stepNumber + ')">派案</button>' +
          '</div>' +
        '</div>' : '';

      return '<div class="card mb-2 border-start border-4 ' + borderClass + ' shadow-sm task-card-clickable" onclick="window.openWorkflow(\'' + safeJobNum + '\')">' +
        '<div class="card-body p-2" style="font-size:0.85em;">' +
          '<div class="d-flex justify-content-between align-items-center mb-1">' +
            '<small class="text-muted fw-bold">' + t.jobNumber + '</small>' +
            '<small class="' + (t.isOverdue ? 'text-danger fw-bold' : 'text-muted') + '"><i class="fas fa-clock"></i> ' + t.deadline + '</small>' +
          '</div>' +
          '<h6 class="fw-bold mb-1 text-dark text-truncate">' + t.client + ' - ' + t.taskName + '</h6>' +
          '<div class="d-flex justify-content-between text-muted mb-1">' +
            '<span>關卡: <strong class="text-primary">' + t.stepName + '</strong></span>' +
            '<span>[' + (t.assignee || '未指派') + ']</span>' +
          '</div>' +
          assignSection +
        '</div>' +
      '</div>';
    }

    if (containerOverdue) containerOverdue.innerHTML = overdueList.length === 0 ? '<div class="text-center text-muted py-4 small">🎉 無逾期任務</div>' : overdueList.map(function(t){ return buildTaskCardHtml(t, 'border-danger', true); }).join('');
    if (containerUnassigned) containerUnassigned.innerHTML = unassignedList.length === 0 ? '<div class="text-center text-muted py-4 small">🎉 無待分配任務</div>' : unassignedList.map(function(t){ return buildTaskCardHtml(t, 'border-info', true); }).join('');
    if (containerDueSoon) containerDueSoon.innerHTML = dueSoonList.length === 0 ? '<div class="text-center text-muted py-4 small">無即將到期任務</div>' : dueSoonList.map(function(t){ return buildTaskCardHtml(t, 'border-warning', false); }).join('');
    if (containerActive) containerActive.innerHTML = activeList.length === 0 ? '<div class="text-center text-muted py-4 small">無進行中任務</div>' : activeList.map(function(t){ return buildTaskCardHtml(t, 'border-primary', false); }).join('');

    if (containerPipeline) {
      if (pipelineList.length === 0) {
        containerPipeline.innerHTML = '<div class="text-center text-muted py-4 small">無未來前置任務</div>';
      } else {
        var pHtml = '';
        pipelineList.forEach(function(t) {
          var safeJobNum = String(t.jobNumber).replace(/'/g, "\\'");
          var displayAssignee = t.assignee || t.pmName || '專案 PM';

          pHtml += '<div class="card mb-2 border-start border-4 border-secondary shadow-sm task-card-clickable" onclick="window.openWorkflow(\'' + safeJobNum + '\')">' +
            '<div class="card-body p-2" style="font-size:0.85em;">' +
              '<div class="d-flex justify-content-between align-items-center mb-1">' +
                '<span class="badge bg-secondary">預計流入: ' + t.stepName + '</span>' +
                '<small class="text-muted fw-bold">' + t.jobNumber + '</small>' +
              '</div>' +
              '<h6 class="fw-bold mb-1 text-dark text-truncate">' + t.client + ' - ' + t.taskName + '</h6>' +
              '<div class="d-flex justify-content-between text-muted small mb-1">' +
                '<span>當前卡在: <strong class="text-danger">' + t.currentFrontStep + '</strong></span>' +
                '<span>負責: <strong>[' + displayAssignee + ']</strong></span>' +
              '</div>' +
            '</div>' +
          '</div>';
        });
        containerPipeline.innerHTML = pHtml;
      }
    }
  }

  function quickDispatchMember(deliverableId, stepNumber) {
    var sel = document.getElementById('assign_select_' + deliverableId + '_' + stepNumber);
    if (!sel || !sel.value) return alert('請選擇要指派的同仁！');
    
    var assignee = sel.value;
    google.script.run.withSuccessHandler(function(res) {
      if (res && res.success) {
        alert('派案成功！');
        fetchDeptOperationData();
      } else {
        alert('派案失敗: ' + res.message);
      }
    }).api_dispatchWorkflowStep('', deliverableId, stepNumber, assignee, currentOpDept);
  }

  function promptQuickShiftDeadline(deliverableId, stepNumber) {
    var newDate = prompt('請輸入新的關卡死線 (yyyy-MM-dd)：', new Date().toISOString().split('T')[0]);
    if (newDate) {
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.success) {
          alert('死線調整成功！');
          fetchDeptOperationData();
        } else { 
          alert('調整失敗: ' + res.message); 
        }
      }).api_updateStepDeadline(deliverableId, stepNumber, newDate.trim());
    }
  }
</script>
