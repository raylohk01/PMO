<!-- ========================================== -->
<!-- [ModalsUI.html] 系統彈出視窗模組 (新增專案 & 權限) -->
<!-- ========================================== -->

<!-- 1. 新增專案 Modal -->
<div class="modal fade" id="newProjectModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-primary text-white py-2">
        <h5 class="modal-title fs-6"><i class="fas fa-plus-circle"></i> 建立新專案</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body bg-light">
        <form id="newProjectForm">
          <h6 class="text-primary border-bottom pb-2 mb-3"><i class="fas fa-info-circle"></i> 1. 基本資訊</h6>
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <label class="form-label small fw-bold">專案編號 (Job No.)</label>
              <input type="text" class="form-control form-control-sm" id="np_jobNumber" required placeholder="例如: A26-1002">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">客戶名稱 (Client)</label>
              <input type="text" class="form-control form-control-sm" id="np_client" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">負責 Sales</label>
              <input type="text" class="form-control form-control-sm" id="np_sales" placeholder="例: Alex" required>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-bold">負責 PM</label>
              <select class="form-select form-select-sm" id="np_pmSelect" required>
                <option value="" disabled selected>載入 PM 中...</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label small fw-bold">暫定開始日</label>
              <input type="date" class="form-control form-control-sm" id="np_tentativeDate">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">總上線死線 (Deadline)</label>
              <input type="date" class="form-control form-control-sm" id="np_deadline" required>
            </div>
          </div>

          <h6 class="text-primary border-bottom pb-2 mb-3 d-flex justify-content-between align-items-center">
            <span><i class="fas fa-tasks"></i> 2. 子項目設定 (Deliverables)</span>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addDeliverableRow()"><i class="fas fa-plus"></i> 新增一項</button>
          </h6>
          <div id="np_deliverablesArea"></div>
        </form>
      </div>
      <div class="modal-footer bg-white py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="submitNewProject()">確認建立專案</button>
      </div>
    </div>
  </div>
</div>

<!-- 2. 成員權限 Modal -->
<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="userModalTitle">權限設定</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <div class="mb-3">
            <label class="form-label fw-bold text-primary">員工編號 (唯一識別碼)</label>
            <input type="text" class="form-control" id="u_empId" required placeholder="例如: E001">
          </div>
          <div class="mb-3">
            <label class="form-label">Email (登入帳號)</label>
            <input type="email" class="form-control" id="u_email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">同事姓名</label>
            <input type="text" class="form-control" id="u_name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">所屬部門 (Team)</label>
            <select class="form-select" id="u_dept" required>
              <option value="">載入部門中...</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">系統權限角色 (Role)</label>
            <select class="form-select" id="u_role" required>
              <option value="">請選擇權限級別...</option>
              <option value="Admin">Admin (最高權限)</option>
              <option value="Management">Management (管理層總覽)</option>
              <option value="Team Head">Team Head (部門看板檢視)</option>
              <option value="Member">Member (一般員工)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold text-danger">帳號狀態</label>
            <select class="form-select" id="u_status" required>
              <option value="Active">🟢 啟用 (Active)</option>
              <option value="Frozen">🔴 凍結 (Frozen / 離職)</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary" onclick="saveUser()"><i class="fas fa-save"></i> 儲存資料</button>
      </div>
    </div>
  </div>
</div>

<script>
  var deliverableCounter = 0;

  function addDeliverableRow() {
    deliverableCounter++;
    var area = document.getElementById('np_deliverablesArea');
    if (!area) return;

    var div = document.createElement('div');
    div.className = 'row g-2 mb-2 align-items-center border p-2 rounded bg-white';
    div.id = 'deliv_row_' + deliverableCounter;
    div.innerHTML = '' +
      '<div class="col-md-5">' +
        '<input type="text" class="form-control form-control-sm np-deliv-name" placeholder="子項目名稱 (例如: 篇章 / 任務 1)" value="篇章 / 任務 ' + deliverableCounter + '" required>' +
      '</div>' +
      '<div class="col-md-5">' +
        '<select class="form-select form-select-sm np-deliv-template">' +
          '<option value="標準 Advertorial" selected>標準 Advertorial</option>' +
          '<option value="Testing">Testing</option>' +
        '</select>' +
      '</div>' +
      '<div class="col-md-2 text-end">' +
        '<button type="button" class="btn btn-sm btn-outline-danger" onclick="removeDeliverableRow(' + deliverableCounter + ')"><i class="fas fa-trash"></i></button>' +
      '</div>';
    area.appendChild(div);
  }

  function removeDeliverableRow(id) {
    var elem = document.getElementById('deliv_row_' + id);
    if (elem) elem.remove();
  }

  // 自動在打開開案視窗時預載至少一個 Deliverable 項目
  document.addEventListener('DOMContentLoaded', function() {
    var modalElem = document.getElementById('newProjectModal');
    if (modalElem) {
      modalElem.addEventListener('show.bs.modal', function () {
        var area = document.getElementById('np_deliverablesArea');
        if (area && area.children.length === 0) {
          addDeliverableRow();
        }
      });
    }
  });

  function submitNewProject() {
    var jobNumber = document.getElementById('np_jobNumber').value.trim();
    var client = document.getElementById('np_client').value.trim();
    var sales = document.getElementById('np_sales').value.trim();
    var pm = document.getElementById('np_pmSelect').value || '';
    var tentativeDate = document.getElementById('np_tentativeDate').value;
    var deadline = document.getElementById('np_deadline').value;

    if (!jobNumber || !client || !deadline) {
      return showAlert('⚠️ 請填寫必填欄位 (專案編號、客戶名稱、總死線)！', 'warning');
    }

    // 💡 預設保險箱：無論畫面有沒有渲染出 row，基礎資料庫中一定保底含有 1 個 Deliverable
    var deliverables = [{
      id: 'deliv_1_' + Date.now(),
      name: '篇章 / 任務 1',
      type: '標準 Advertorial',
      status: 'Pending Start'
    }];

    // 嘗試從 DOM 抓取使用者自行新增的動態子項目
    var delivRows = document.querySelectorAll('#np_deliverablesArea .row');
    if (delivRows && delivRows.length > 0) {
      var customDelivs = [];
      delivRows.forEach(function(row, idx) {
        var nameInput = row.querySelector('.np-deliv-name');
        var tplSelect = row.querySelector('.np-deliv-template');
        customDelivs.push({
          id: 'deliv_' + (idx + 1) + '_' + Date.now(),
          name: (nameInput && nameInput.value.trim()) ? nameInput.value.trim() : ('篇章 / 任務 ' + (idx + 1)),
          type: tplSelect ? tplSelect.value : '標準 Advertorial',
          status: 'Pending Start'
        });
      });
      if (customDelivs.length > 0) deliverables = customDelivs;
    }

    var payload = {
      jobNumber: jobNumber,
      client: client,
      sales: sales,
      pm: pm,
      tentativeDate: tentativeDate,
      deadline: deadline,
      productType: deliverables[0].type,
      deliverables: deliverables,
      productName: JSON.stringify({ deliverables: deliverables })
    };

    // 發送給後端
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          showAlert('🎉 專案 [' + jobNumber + '] 建立成功！', 'success');
          var modalElem = document.getElementById('newProjectModal');
          if (modalElem && typeof bootstrap !== 'undefined') {
            var modalInstance = bootstrap.Modal.getInstance(modalElem);
            if (modalInstance) modalInstance.hide();
          }
          if (typeof loadAllDashboardViews === 'function') loadAllDashboardViews();
        } else {
          showAlert('❌ 建立失敗: ' + (res ? res.message : '未知錯誤'), 'danger');
        }
      })
      .withFailureHandler(function(err) {
        showAlert('❌ 後端執行錯誤: ' + (err ? err.message : '連線失敗'), 'danger');
      })
      .api_createProject(JSON.stringify(payload));
  }
</script>
