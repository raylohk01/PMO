<!-- ========================================== -->
<!-- [AdminUI.html] 系統管理面板 (無重複區塊 + 正確順序 + 步驟換行版) -->
<!-- ========================================== -->

<style>
  /* 💡 強制步驟流程鏈所有容器與標籤自動換行 */
  #templateTableBody td {
    white-space: normal !important;
    word-break: break-word !important;
  }
  #templateTableBody div,
  #templateTableBody .d-flex {
    flex-wrap: wrap !important;
    white-space: normal !important;
    overflow: visible !important;
  }
  #templateTableBody .badge,
  #templateTableBody span {
    white-space: normal !important;
    display: inline-flex !important;
    align-items: center;
    margin-top: 2px;
    margin-bottom: 2px;
  }
</style>

<!-- 系統管理標題區塊 -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0 fw-bold"><i class="fas fa-cog me-2 text-secondary"></i>系統管理面板</h4>
</div>

<!-- 1. 工作流範本庫管理 -->
<div id="templateConfigBlock" class="mb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-secondary mb-0"><i class="fas fa-layer-group me-2"></i>工作流範本庫管理</h3>
    <button class="btn btn-primary fw-bold" onclick="openTemplateModal()"><i class="fas fa-plus me-1"></i> 新增視覺化範本</button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th style="width: 20%;">範本名稱</th>
              <th style="width: 70%;">步驟流程鏈</th>
              <th class="text-end pe-3" style="width: 10%;">操作</th>
            </tr>
          </thead>
          <tbody id="templateTableBody">
            <tr><td colspan="3" class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-1"></i> 載入範本中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 2. 系統權限/成員管理 (已移至上方) -->
<div id="userManagementBlock" class="mb-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-secondary mb-0"><i class="fas fa-users-cog me-2"></i> 系統權限/成員管理</h3>
    <div>
      <button id="addUserBtn" class="btn btn-primary fw-bold" onclick="openUserModal()"><i class="fas fa-plus me-1"></i> 新增/編輯同事</button>
    </div>
  </div>
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
        <table class="table table-hover align-middle mb-0" style="font-size: 0.9em;">
          <thead class="table-dark sticky-top">
            <tr>
              <th>員工編號 (PK)</th>
              <th>Email</th>
              <th>姓名</th>
              <th>部門 (Team)</th>
              <th>系統角色 (Role)</th>
              <th>狀態</th>
              <th class="text-end pe-3">操作</th>
            </tr>
          </thead>
          <tbody id="userTableBody">
            <tr><td colspan="7" class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-1"></i> 載入中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- 3. 部門與標籤顏色設定 (已移至最下方) -->
<div id="deptConfigBlock" class="mb-5">
  <h3 class="text-secondary mb-3"><i class="fas fa-palette me-2"></i> 部門與標籤顏色設定</h3>
  <div class="card shadow-sm border-0">
    <div class="card-body p-3">
      <div class="row align-items-center mb-3">
        <div class="col-md-4">
          <input type="text" id="newDeptName" class="form-control" placeholder="輸入新部門名稱...">
        </div>
        <div class="col-md-2">
          <input type="color" id="newDeptColor" class="form-control color-picker" value="#0dcaf0" title="選擇代表顏色">
        </div>
        <div class="col-md-3">
          <button class="btn btn-outline-info fw-bold" onclick="saveDepartment()"><i class="fas fa-plus me-1"></i> 新增 / 更新</button>
        </div>
      </div>
      <hr>
      <div id="deptBadgesArea">
        <span class="text-muted"><i class="fas fa-spinner fa-spin me-1"></i> 載入部門資料中...</span>
      </div>
    </div>
  </div>
</div>

<!-- 範本編輯 Modal -->
<div class="modal fade" id="templateEditModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content shadow-lg">
      <div class="modal-header bg-primary text-white py-2">
        <h5 class="modal-title fs-6" id="tmplModalTitle"><i class="fas fa-edit me-1"></i> 編輯工作流範本</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body bg-light">
        <div class="mb-3 bg-white p-3 rounded border">
          <label class="form-label fw-bold text-dark">範本名稱 (Template Name)</label>
          <input type="text" class="form-control" id="tmpl_name" placeholder="例如: 標準 Advertorial / 短影片">
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold text-primary mb-0"><i class="fas fa-list-ol me-1"></i> 步驟關卡設定</h6>
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="addTemplateStep()"><i class="fas fa-plus me-1"></i> 新增關卡步驟</button>
        </div>

        <div id="tmpl_stepsContainer"></div>
      </div>
      <div class="modal-footer bg-white py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-success btn-sm fw-bold" onclick="saveTemplateFromModal()"><i class="fas fa-save me-1"></i> 儲存範本</button>
      </div>
    </div>
  </div>
</div>
