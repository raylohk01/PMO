<!-- [ClientReviewUI.html] 客戶追蹤與 Client Review 追蹤模組 -->
<!-- ========================================== -->

<div id="clientReviewSection" class="section-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="text-warning mb-0"><i class="fas fa-clock me-2"></i> Client Review 等待與催辦清單</h3>
    <button class="btn btn-sm btn-outline-secondary" onclick="loadClientReviewView()">
      <i class="fas fa-sync-alt me-1"></i> 重新整理
    </button>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Job Number</th>
              <th>客戶名稱</th>
              <th>子項目 / 任務</th>
              <th>負責 PM</th>
              <th>負責 Sales</th>
              <th>等待天數</th>
              <th>狀態標籤</th>
              <th class="text-end pe-3">操作動作</th>
            </tr>
          </thead>
          <tbody id="clientReviewTableBody">
            <tr><td colspan="8" class="text-center text-muted py-4"><i class="fas fa-spinner fa-spin"></i> 載入 Client Review 資料中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
